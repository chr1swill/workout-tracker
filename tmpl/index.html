<!doctype html>
<html>
  <head>
    <title>Home page</title>
  </head>
  <body>
		<section>
		  <form method="post" action="/add_exercise_name/">
		  	<fieldset>
		  	  <legend>Select Exercise Type:</legend>

		  	  <input
		  		type="radio"
		  		id="cardio"
		  		name="type"
		  		value="cardio" required></input>
		  	  <label for="cardio">Cardio</label><br>

		  	  <input 
		  		type="radio"
		  		id="strength"
		  		name="type"
		  		value="strength" checked required></input>
		  	  <label for="strength">Strength</label><br>
		  	</fieldset>

		  	<fieldset>
		  	  <legend>Select Exercise Type:</legend>
		  	  <label for="name">Enter Name:</label>
		  	  <input id="name" name="name" min="1" max="32" required></input>
		  	</fieldset>

		    <button type="submit">submit</button>
		  </form>
		  </section>

		<section>
		  <form method="post" action="/add_exercise/">
		    <fieldset>
		  	  <!--
		  		TODO: Would be a cool feture if as
		  		you change add event type radio above
		  		it should dynamically swap this list aswell
		  		if caching with the db is set up on the client
		  		correctly then doing that can be suuuuuuper fast
		  		-->
		  	  <legend>Select Excercise:</legend>
		  	  <!--
		  	  Doing like for loop over the date to
		  	  create each excercise name on the server 
		  	  -->
		  		<label for="exercise" style="display: none;">Choose your exercise name.</label>
		  		<select id="exercise" name="exercise" required>
					  {{ range .Exercises }}
		  		  <option 
						value="{{ .Name }}" 
						data-id="{{ .Id }}" 
						data-type="{{ .Type }}">{{ .Name }}</option>
					  {{ end }}
		  		</select>
		    </fieldset>

		    <fieldset>
		  	  <legend>Select Weight:</legend>
		  		<label for="weight" style="display: none;">Choose weight value in pounds.</label>
		  		<select id="weight" name="weight" required>
					  {{ range .Weights }}
						<option 
						data-id="{{ .Id }}"
						value="{{- .WeightInLbs -}}">{{- .WeightInLbs }} lbs</option>
						{{ end }}
		  		</select>
		    </fieldset>
		  	<fieldset>
		  	  <legend>Select Number of Reps:</legend>
		  	  <label for="number_of_reps">Name:</label>
		  	  <input id="number_of_reps" name="number_of_reps" type="number" min="1" required></input>
		  	</fieldset>

		    <button type="submit">submit</button>
		  </form>
		</section>
  </body>
</html>
